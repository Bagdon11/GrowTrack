name: Build & Release APK

# Triggers: every push to main (for pre-release dev builds) and every
# version tag push (e.g. "git tag v1.0.1 && git push --tags") for a
# proper GitHub Release with the APK attached.
on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java (required by Gradle) ────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Node ────────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Dependencies ─────────────────────────────────────────────────────────
      - name: Install JS dependencies
        run: npm ci

      # ── Android SDK ──────────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── Gradle cache ─────────────────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── Keystore (from GitHub Secrets) ────────────────────────────────────────
      # Secrets to create in your repo Settings → Secrets → Actions:
      #   KEYSTORE_BASE64  — base64-encoded .jks file (see README for how to generate)
      #   KEY_ALIAS        — key alias (e.g. "growtrack")
      #   KEY_PASSWORD     — key password
      #   STORE_PASSWORD   — keystore password
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/growtrack.keystore

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: growtrack.keystore
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      # ── Upload APK as build artifact (available on every push to main) ───────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: growtrack-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # ── Create GitHub Release (only on version tags) ─────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          name: GrowTrack ${{ github.ref_name }}
          body: |
            ## What's new in ${{ github.ref_name }}

            See commit history for changes.

            ### Install
            1. Download `app-release.apk` below
            2. Open the file on your Android phone
            3. If prompted, allow installs from this source
            4. Tap Install
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
